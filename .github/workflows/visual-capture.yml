name: Game2 real-render screenshots

on:
  pull_request:
    paths:
      - 'tests/capture_visuals.gd'
      - 'tests/player_journey.gd'
      - 'tests/capture_free_roam.gd'
      - 'tests/capture_school.gd'
      - '.github/workflows/visual-capture.yml'
      - '.github/actions/setup-godot/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
  push:
    branches: [main]
    paths:
      - 'tests/capture_visuals.gd'
      - 'tests/player_journey.gd'
      - 'tests/capture_free_roam.gd'
      - 'tests/capture_school.gd'
      - '.github/workflows/visual-capture.yml'
      - '.github/actions/setup-godot/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 / software GL dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri mesa-utils fonts-noto-cjk fontconfig
          fc-cache -f
          command -v xvfb-run
      - uses: ./.github/actions/setup-godot
      - name: Import resources
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/import.log; then exit 1; fi
      - name: Run actual in-engine X11 screenshots
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          mkdir -p build/visual-captures
          timeout 150s xvfb-run -a -s '-screen 0 1280x720x24' \
            Godot_v4.7.2-stable_linux.x86_64 --path . \
            --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 \
            --script res://tests/capture_visuals.gd 2>&1 | tee /tmp/visual.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|VISUAL_CAPTURE_FAILED:' /tmp/visual.log; then exit 1; fi
          grep -q 'VISUAL_CAPTURE_OK: 13' /tmp/visual.log
          test "$(find build/visual-captures -maxdepth 1 -name '*.png' | wc -l)" -eq 13
          for png in build/visual-captures/*.png; do test -s "$png"; done
      - name: Upload actual game images
        uses: actions/upload-artifact@v4
        with:
          name: Game2-Actual-Render-Screenshots
          path: build/visual-captures/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Reported dialogue and off-route visual regressions
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 2048x1152x24' \
            Godot_v4.7.2-stable_linux.x86_64 --path . --fixed-fps 60 \
            --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 \
            --script res://tests/capture_free_roam.gd 2>&1 | tee /tmp/free-roam-visual.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|FREE_ROAM_CAPTURE_FAILED:' /tmp/free-roam-visual.log; then exit 1; fi
          grep -q 'FREE_ROAM_CAPTURE_OK: 11' /tmp/free-roam-visual.log
          test "$(find build/free-roam-captures -maxdepth 1 -name '*.png' | wc -l)" -eq 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Game2-Free-Roam-Regression
          path: build/free-roam-captures/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Optional classroom real-render captures
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' \
            Godot_v4.7.2-stable_linux.x86_64 --path . --fixed-fps 60 \
            --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 \
            --script res://tests/capture_school.gd 2>&1 | tee /tmp/school-visual.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|SCHOOL_CAPTURE_FAILED:' /tmp/school-visual.log; then exit 1; fi
          grep -q 'SCHOOL_CAPTURE_OK: 4' /tmp/school-visual.log
          test "$(find build/school-captures -maxdepth 1 -name '*.png' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Game2-School-Regression
          path: build/school-captures/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Continuous player input playthrough
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          timeout 240s xvfb-run -a -s '-screen 0 1280x720x24' \
            Godot_v4.7.2-stable_linux.x86_64 --path . --fixed-fps 60 \
            --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 \
            --script res://tests/player_journey.gd 2>&1 | tee /tmp/player-journey.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|PLAYER_JOURNEY_FAILED:' /tmp/player-journey.log; then exit 1; fi
          grep -q 'PLAYER_JOURNEY_OK: 16' /tmp/player-journey.log
          test "$(find build/player-journey -maxdepth 1 -name '*.png' | wc -l)" -eq 16
          test -s build/player-journey/journey.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Game2-Player-Journey
          path: build/player-journey/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve failed renderer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Game2-Renderer-Failure-Logs
          path: |
            /tmp/import.log
            /tmp/visual.log
            /tmp/free-roam-visual.log
            /tmp/school-visual.log
            /tmp/player-journey.log
          if-no-files-found: warn
          retention-days: 14
