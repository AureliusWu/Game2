name: Godot smoke and Windows build

on:
  push:
    branches: [main, feat/first-folklore-prototype]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot-editor.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot-editor.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$GITHUB_WORKSPACE/.godot-bin" >> "$GITHUB_PATH"
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import resources and parse scripts
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
      - name: Scene smoke test
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd

  windows-build:
    needs: [smoke]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 -o /tmp/godot-editor.zip "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-editor.zip -d /tmp/godot-editor
          chmod +x /tmp/godot-editor/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot-editor" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q -o /tmp/templates.tpz 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Import and export Windows x64
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
          mkdir -p build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/Game2.exe
          test -s build/Game2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Game2-Windows-x64
          path: build/
          if-no-files-found: error
          retention-days: 14
