name: Godot smoke and Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Import and validate scripts (strict errors)
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-import.log; then
            echo "Godot import emitted errors" >&2
            exit 1
          fi
      - name: Scene smoke test (strict)
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-smoke.log; then
            echo "Godot smoke emitted errors" >&2
            exit 1
          fi
          grep -q 'SMOKE_OK:' /tmp/godot-smoke.log
      - name: Case 01 logic test (strict)
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/case01.gd 2>&1 | tee /tmp/godot-case01.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-case01.log; then
            echo "Godot case test emitted errors" >&2
            exit 1
          fi
          grep -q 'CASE01_OK:' /tmp/godot-case01.log
      - name: Walkable investigation and compact UI regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/exploration.gd 2>&1 | tee /tmp/godot-exploration.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-exploration.log; then
            exit 1
          fi
          grep -q 'EXPLORATION_OK:' /tmp/godot-exploration.log
      - name: Player progression and restart regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/player_ux.gd 2>&1 | tee /tmp/godot-player-ux.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-player-ux.log; then exit 1; fi
          grep -q 'PLAYER_UX_OK:' /tmp/godot-player-ux.log
      - name: Free-roam viewpoints, collisions and dialogue lifecycle
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/free_roam.gd 2>&1 | tee /tmp/godot-free-roam.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-free-roam.log; then exit 1; fi
          grep -q 'FREE_ROAM_OK:' /tmp/godot-free-roam.log

      - name: Optional classroom and save compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/school.gd 2>&1 | tee /tmp/godot-school.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/godot-school.log; then exit 1; fi
          grep -q 'SCHOOL_OK:' /tmp/godot-school.log

      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Game2-Test-Failure-Logs
          path: /tmp/godot-*.log
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    needs: [smoke]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          windows-templates: 'true'
      - name: Import and export Windows x64
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee /tmp/build-import.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/build-import.log; then
            exit 1
          fi
          mkdir -p build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/Game2.exe 2>&1 | tee /tmp/build-export.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:' /tmp/build-export.log; then
            exit 1
          fi
          test -s build/Game2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Game2-Windows-x64
          path: build/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Game2-Export-Failure-Logs
          path: /tmp/build-*.log
          if-no-files-found: warn
          retention-days: 14
