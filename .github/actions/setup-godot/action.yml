name: Set up pinned Godot
description: Cache and verify the official Godot 4.7.2 Linux editor and optional Windows templates
inputs:
  windows-templates:
    description: Restore Windows export templates
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Require the supported runner
      shell: bash
      run: test "$(uname -sm)" = 'Linux x86_64'
    - name: Restore editor cache
      id: editor
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/godot-editor-4.7.2
        key: game2-godot-editor-v1-${{ runner.os }}-${{ runner.arch }}-4.7.2
    - name: Download official editor on cache miss
      if: steps.editor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/godot-editor-4.7.2"
        mkdir -p "$tool_dir"
        curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
          -o "$RUNNER_TEMP/godot-editor.zip" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q -o "$RUNNER_TEMP/godot-editor.zip" -d "$tool_dir"
    - name: Verify editor identity and expose command
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/godot-editor-4.7.2"
        chmod +x "$tool_dir/Godot_v4.7.2-stable_linux.x86_64"
        "$tool_dir/Godot_v4.7.2-stable_linux.x86_64" --version | tee "$RUNNER_TEMP/godot-version.log"
        grep -Eq '^4\.7\.2\.stable\.official\.' "$RUNNER_TEMP/godot-version.log"
        echo "$tool_dir" >> "$GITHUB_PATH"
    - name: Restore Windows template cache
      if: inputs.windows-templates == 'true'
      id: templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/4.7.2.stable
        key: game2-godot-windows-templates-v1-${{ runner.os }}-${{ runner.arch }}-4.7.2
    - name: Download Windows templates on cache miss
      if: inputs.windows-templates == 'true' && steps.templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        templates_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
        mkdir -p "$templates_dir"
        curl -fL --retry 3 --connect-timeout 20 --max-time 300 \
          -o "$RUNNER_TEMP/godot-templates.tpz" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        unzip -j -q -o "$RUNNER_TEMP/godot-templates.tpz" 'templates/windows*' 'templates/version.txt' -d "$templates_dir"
    - name: Verify Windows release template
      if: inputs.windows-templates == 'true'
      shell: bash
      run: test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"
